<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full bg-[#F4F7FC]">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>غير متصل بالإنترنت — WorldSkills Algeria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans antialiased h-full flex flex-col justify-center items-center text-[#06205C] bg-[#F4F7FC] p-4">
    
    <div class="max-w-md w-full bg-white rounded-3xl p-8 sm:p-10 shadow-2xl border border-slate-200/80 text-center space-y-6">
        
        <!-- Official Logo -->
        <div class="w-16 h-16 mx-auto rounded-2xl bg-brand-50 p-3 border border-slate-100 flex items-center justify-center shadow-sm">
            <img src="/logo.svg" alt="WorldSkills Algeria" class="max-h-full max-w-full object-contain">
        </div>

        <div class="space-y-2">
            <h1 class="text-2xl font-black text-[#06205C]">لا يوجد اتصال بالإنترنت</h1>
            <p class="text-xs text-slate-500 font-medium leading-relaxed">
                أنت حالياً تعمل بدون إنترنت (Offline Mode). سيتم مزامنة البيانات واستعادة التصفح الكامل فور عودة الاتصال.
            </p>
        </div>

        <!-- Offline Info Callout -->
        <div class="p-4 rounded-2xl bg-amber-50 border border-amber-200 text-amber-900 text-xs font-bold space-y-1 text-right">
            <p class="text-xs font-black">🔒 حماية وأمان البيانات (Zero-Trust Security):</p>
            <ul class="text-[11px] font-semibold text-amber-800 list-disc list-inside space-y-1 mt-1">
                <li>لا يتم تخزين البيانات الشخصية أو التسجيلات offline.</li>
                <li>التسجيل والتحقق من الشهادات ينشط فقط عند الاتصال.</li>
            </ul>
        </div>

        <button onclick="window.location.reload()" class="w-full py-3.5 rounded-2xl bg-[#0066FF] hover:bg-[#0052CC] text-white font-black text-xs shadow-lg transition flex items-center justify-center gap-2">
            <svg class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            <span>إعادة محاولة الاتصال (Retry Connection)</span>
        </button>

    </div>

</body>
</html>
